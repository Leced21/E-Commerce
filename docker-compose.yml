services:
  db:
    image: postgres:16
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    container_name: ecommerce-web-dev
    profiles: ["dev"]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
    - .env
    environment:
      POSTGRES_HOST: db
    volumes:
    - ./backend:/app
    ports:
    - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healty
  web_prod:
    container_name: ecommerce-web-prod
    profiles: ["prod"]
    image: ${IMAGE_TAG}
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    command: gunicorn ecommerce.wsgi:application --bind 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healty
  nginx_prod: # NOUVEAU SERVICE
    container_name: ecommerce-nginx-prod
    profiles: ["prod"]
    image: nginx:stable-alpine
    volumes:
      # Mappe le fichier de configuration Nginx que nous avons créé
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Nginx écoute le port 80 (standard HTTP) et l'expose à l'hôte
      - "80:80" 
    depends_on:
      - web_prod
volumes:
  postgres_data: