{% extends 'base.html' %}

{% block content %}
<div class="py-6">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-8">Nos Nouveautés</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        {% for product in products %}
        <div class="group bg-white rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 overflow-hidden border border-gray-100">
            <div class="relative h-64 overflow-hidden">
                <img src="{% if product.variants.first.image %}{{ product.variants.first.image.url }}{% else %}https://via.placeholder.com/300{% endif %}" 
     alt="{{ product.name }}"
     class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500">
                <div class="absolute top-3 right-3">
                    <span class="bg-white/90 backdrop-blur px-3 py-1 rounded-full text-sm font-semibold text-gray-800 shadow-sm">
                        {{ product.category }}
                    </span>
                </div>
            </div>

            <div class="p-5">
                <h3 class="text-lg font-bold text-gray-800 mb-1 truncate">{{ product.name }}</h3>
                <p class="text-sm text-gray-500 mb-4 line-clamp-2">{{ product.description }}</p>
                
                <div class="flex items-center justify-between">
                    <span class="text-2xl font-black text-blue-600">{{ product.price_default }} €</span>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-lg transition-colors shadow-lg shadow-blue-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        {% empty %}
        <p class="text-center text-gray-500 col-span-full py-20 italic">Aucun produit n'est disponible pour le moment.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
