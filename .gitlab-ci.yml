stages:
  - test
  - build
  - deploy_dev

variables:
  PROJECT_NAME: "ecommerce"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:latest"

test:
  stage: test
  image: python:3.12-slim
  services:
  - name: postgres:16
    alias: db
  variables:
    POSTGRES_DB: ecommerce
    POSTGRES_USER: ecommerce
    POSTGRES_PASSWORD: ecommerce
    POSTGRES_HOST: db
    DJANGO_SETTINGS_MODULE: ecommerce.settings
  script:
    - export DB_PORT=5432
    - unset POSTGRES_PORT PGPORT
    - pip install -r backend/requirements.txt
    - cd backend
    - python manage.py migrate
    - pytest || if [ $? -eq 5 ]; then echo "Aucun test trouvé, on continue."; else exit 1; fi
    - flake8 .
    - black --check .
  rules:
    - if: $CI_COMMIT_BRANCH

build:
  stage: build
  image: docker:27.3
  services:
    - docker:27.3-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f infra/docker/backend.Dockerfile -t "$IMAGE_TAG" --build-arg ENVIRONMENT=prod .
    - docker push "$IMAGE_TAG"
  needs:
    - test
  rules:
    - if: $CI_COMMIT_BRANCH

deploy_dev:
  stage: deploy_dev
  tags:
    - local-runner
  script:
    - docker login -u "$env:CI_REGISTRY_USER" -p "$env:CI_REGISTRY_PASSWORD" "$env:CI_REGISTRY"
    - docker compose pull
    - docker compose up -d
    - docker compose exec -T web python manage.py migrate --noinput
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  when: on_success