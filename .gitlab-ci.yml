stages:
  - test
  - build
  - deploy_dev
  - deploy_prod

variables:
  PROJECT_NAME: "ecommerce"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

# Login au registry Docker de GitLab pour les jobs qui en ont besoin

# --------- TESTS ---------
test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16
      alias: db
  variables:
    POSTGRES_DB: ecommerce
    POSTGRES_USER: ecommerce
    POSTGRES_PASSWORD: ecommerce
    POSTGRES_HOST: db
    DJANGO_SETTINGS_MODULE: ecommerce.settings.dev
  script:
    - export DB_PORT=5432
    - unset POSTGRES_PORT PGPORT
    - pip install -r backend/requirements/dev.txt
    - cd backend
    - python manage.py migrate
    - pytest
    - flake8 .
    - black --check .
  rules:
    - if: $CI_COMMIT_BRANCH

# --------- BUILD IMAGE ---------
build:
  stage: build
  image: docker:27.3
  services:
    - docker:27.3-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f infra/docker/backend.Dockerfile -t "$IMAGE_TAG" --build-arg ENVIRONMENT=prod .
    - docker push "$IMAGE_TAG"
  needs:
    - test
  rules:
    - if: $CI_COMMIT_BRANCH

# --------- DEPLOY DEV (branche develop) ---------
deploy_dev:
  stage: deploy_dev
  image: alpine:3.20
  environment:
    name: dev
    url: https://$DEV_DOMAIN
  script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_DEV" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - export REPO_SSH_URL="git@gitlab.com:$CI_PROJECT_PATH.git"
    - ssh -o StrictHostKeyChecking=no "$SSH_USER_DEV@$SSH_HOST_DEV" "
        set -e
        if [ ! -d /opt/$PROJECT_NAME ]; then
          mkdir -p /opt/$PROJECT_NAME
          cd /opt/$PROJECT_NAME
          git clone '$REPO_SSH_URL' .
        else
          cd /opt/$PROJECT_NAME
          git fetch origin
          git checkout $CI_COMMIT_REF_NAME
          git reset --hard origin/$CI_COMMIT_REF_NAME
        fi
        docker login -u '$CI_REGISTRY_USER' -p '$CI_REGISTRY_PASSWORD' $CI_REGISTRY
        export IMAGE_TAG='$IMAGE_TAG' \
               POSTGRES_PASSWORD='$POSTGRES_PASSWORD_DEV' \
               DJANGO_SECRET_KEY_DEV='$DJANGO_SECRET_KEY_DEV' \
               DJANGO_ALLOWED_HOSTS_DEV='$DJANGO_ALLOWED_HOSTS_DEV'
        docker compose -f docker-compose.dev.yml up -d --remove-orphans
      "
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# --------- DEPLOY PROD (branche main, déclenchement manuel) ---------
deploy_prod:
  stage: deploy_prod
  image: alpine:3.20
  environment:
    name: production
    url: https://$PROD_DOMAIN
  script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_PROD" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - export REPO_SSH_URL="git@gitlab.com:$CI_PROJECT_PATH.git"
    - ssh -o StrictHostKeyChecking=no "$SSH_USER_PROD@$SSH_HOST_PROD" "
        set -e
        if [ ! -d /opt/$PROJECT_NAME ]; then
          mkdir -p /opt/$PROJECT_NAME
          cd /opt/$PROJECT_NAME
          git clone '$REPO_SSH_URL' .
        else
          cd /opt/$PROJECT_NAME
          git fetch origin
          git checkout main
          git reset --hard origin/main
        fi
        docker login -u '$CI_REGISTRY_USER' -p '$CI_REGISTRY_PASSWORD' $CI_REGISTRY
        export IMAGE_TAG='$IMAGE_TAG' \
               POSTGRES_PASSWORD='$POSTGRES_PASSWORD_PROD' \
               DJANGO_SECRET_KEY='$DJANGO_SECRET_KEY_PROD' \
               DJANGO_ALLOWED_HOSTS='$DJANGO_ALLOWED_HOSTS_PROD'
        docker compose -f docker-compose.prod.yml up -d --remove-orphans
      "
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual


