# Fichier : infra/nginx/nginx_http.conf
server {
    listen 80;
    server_name localhost; # Remplacez par votre vrai domaine

    # Supprimer ou commenter la ligne de redirection 301 :
    # return 301 https://$host$request_uri; 
    
    # 1. Gestion des fichiers statiques
    # location /static/ {
    #     # Pointe vers le volume static_data partagé
    #     alias /static/; 
    #     # Cache pour les fichiers statiques (images, CSS, JS)
    #     expires 30d;
    # }
    # 2. Gestion des fichiers médias (si non migrés vers GCS/CDN)
    # Si vous n'avez PAS encore migré les médias vers GCS, vous auriez besoin
    # d'un volume partagé et d'un bloc comme celui-ci :
    # location /media/ {
    #     alias /mediafiles/; 
    #     expires 30d;
    # }

    # 3. Gestion de l'application (Proxy vers Gunicorn)
    location / {
        proxy_pass http://web_prod:8000; # Nom du service Docker Compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        
        # Le délai d'attente doit être adapté à vos requêtes les plus longues
        client_max_body_size 50M; 
    }
}