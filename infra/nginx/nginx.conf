# Fichier : infra/nginx/nginx.conf
upstream django {
    # web_prod est le nom du conteneur/service
    server web_prod:8000; 
}

server {
    listen 80;
    server_name localhost;

    # Gère les requêtes pour l'application Django
    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # IMPORTANT: Vous devriez aussi configurer un emplacement pour les fichiers statiques (ex: /static)
    # location /static/ {
    #     alias /chemin/vers/fichiers/statiques; 
    # }
}